<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BusiVibes Artist Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <section class="artist-dashboard">
    <h2>🎤 Artist Dashboard</h2>

    <!-- Profile Section -->
    <div class="profile-section">
      <img src="../assets/images/artists4.png" alt="Artist Profile Picture">
      <h3>Paul Beats</h3>
      <button>Edit Profile</button>
    </div>

    <!-- Upload Section -->
    <div class="upload-section">
      <h3>Upload New Song</h3>
      <input type="file" accept=".mp3">
      <input type="text" placeholder="Song Title">
      <button>Upload Song</button>

      <h3>Upload New Video</h3>
      <input type="file" accept=".mp4">
      <input type="text" placeholder="Video Title">
      <button>Upload Video</button>
    </div>

    <!-- Analytics Section -->
    <div class="analytics-section">
      <h3>Performance Stats</h3>
      <p>Songs Played: 12K</p>
      <p>Videos Watched: 8K</p>
      <p>Top Song: Champion</p>
    </div>
  </section>

</body>
<script type="module" src="../js/main.js"></script>
</html>
