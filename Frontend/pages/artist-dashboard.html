<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BusiVibes Artist Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <section class="artist-dashboard">
    <h2>🎤 Artist Dashboard</h2>

    <div class="profile-section">
      <img id="profileImage" src="../assets/images/artists4.jpg" alt="Artist Profile Picture">
      <div class="profile-copy">
        <h3 id="artistName">Paul Beats</h3>
        <p id="artistWelcome">Welcome back</p>
      </div>
      <button id="editProfileButton" type="button">Edit Profile</button>
    </div>

    <div class="upload-section">
      <h3>Upload New Song</h3>
      <input id="songFile" type="file" accept=".mp3,audio/mpeg">
      <input id="songTitle" type="text" placeholder="Song Title">
      <button id="uploadSongButton" type="button">Upload Song</button>

      <h3>Upload New Video</h3>
      <input id="videoFile" type="file" accept=".mp4,video/mp4">
      <input id="videoTitle" type="text" placeholder="Video Title">
      <button id="uploadVideoButton" type="button">Upload Video</button>
    </div>

    <div class="analytics-section">
      <h3>Performance Stats</h3>
      <p id="songsPlayed">Songs Played: 12K</p>
      <p id="videosWatched">Videos Watched: 8K</p>
      <p id="topSong">Top Song: Champion</p>
    </div>
  </section>

</body>
<script src="../js/dashboard.js"></script>
<script src="../js/main.js"></script>
</html>
