<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artists | BusiVibes</title>

    <link rel="stylesheet" href="css/dashboard.css">

    <style>

        .artists-page-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .artist-directory-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .artist-directory-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.12);
        }

        .artist-directory-image {
            width: 120px;
            height: 120px;
            margin: 0 auto 18px;
            border-radius: 50%;
            overflow: hidden;
            background: #eee;
        }

        .artist-directory-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .artist-directory-card h3 {
            margin-bottom: 6px;
            font-size: 1.25rem;
        }

        .artist-directory-card p {
            color: #777;
            margin-bottom: 18px;
        }

        .artist-view-btn {
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            background: #8f00ff;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .artist-view-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .artist-search {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .artist-search input {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
        }

        .artist-search input:focus {
            border-color: #8f00ff;
        }

        .empty-artists {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 18px;
            color: #777;
        }

        @media (max-width: 600px) {

            .artist-search {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

    <div class="dashboard-container">


        <!-- ===============================
             SIDEBAR
        ================================ -->

        <aside class="sidebar">

            <div class="sidebar-logo">
                <h2>BusiVibes</h2>
            </div>


            <nav class="sidebar-nav">

                <a href="fan-dashboard.html" class="nav-link">
                    🏠 Dashboard
                </a>

                <a href="discover-music.html" class="nav-link">
                    🎵 Discover Music
                </a>

                <a href="liked-songs.html" class="nav-link">
                    ❤️ Liked Songs
                </a>

                <a href="downloads.html" class="nav-link">
                    📥 Downloads
                </a>

                <a href="following-artists.html" class="nav-link">
                    👥 Following Artists
                </a>

                <a href="my-playlists.html" class="nav-link">
                    📀 My Playlists
                </a>

                <a href="artists.html" class="nav-link active">
                    🎤 Artists
                </a>

                <a href="#" class="nav-link">
                    📅 Events
                </a>

                <a href="#" class="nav-link">
                    🛍️ Merchandise
                </a>

                <a href="#" class="nav-link">
                    ⚙️ My Profile
                </a>

            </nav>


            <div class="sidebar-bottom">

                <a href="#" class="nav-link logout">
                    🚪 Logout
                </a>

            </div>

        </aside>


        <!-- ===============================
             MAIN CONTENT
        ================================ -->

        <main class="dashboard-main">


            <!-- HEADER -->

            <header class="dashboard-header">

                <div>

                    <h1>
                        Artists 🎤
                    </h1>

                    <p>
                        Discover talented artists on BusiVibes.
                    </p>

                </div>


                <div class="user-info">

                    <div class="user-avatar">
                        👤
                    </div>

                    <div>

                        <strong id="fanName">
                            Fan
                        </strong>

                        <span>
                            Fan Account
                        </span>

                    </div>

                </div>

            </header>


            <!-- ===============================
                 SEARCH ARTISTS
            ================================ -->

            <section class="dashboard-section">

                <div class="artist-search">

                    <input
                        type="text"
                        id="artistSearch"
                        placeholder="Search artists..."
                    >

                </div>

            </section>


            <!-- ===============================
                 ARTISTS
            ================================ -->

            <section class="dashboard-section">

                <div class="section-heading">

                    <h2>
                        BusiVibes Artists
                    </h2>

                </div>


                <div
                    class="artists-page-grid"
                    id="artistsContainer"
                >

                </div>

            </section>


            <!-- FOOTER -->

            <footer class="dashboard-footer">

                <p>
                    © 2026 BusiVibes. All Rights Reserved.
                </p>

            </footer>


        </main>

    </div>


   <script src="busivibes-data.js"></script>

   <script>

   // ========================================
   // CURRENT USER
   // ========================================

   let currentUser = null;

   try {

       currentUser = JSON.parse(
           localStorage.getItem("busiVibesCurrentUser")
       );

   } catch (error) {

       currentUser = null;

   }

   if (!currentUser) {

       window.location.href = "login.html";

   } else {

       const fanName =
           document.getElementById("fanName");

       if (fanName) {

           fanName.textContent =
               currentUser.fullName ||
               currentUser.name ||
               "Fan";

       }

   }

   // ========================================
   // BUSIVIBES ARTISTS
   // ========================================

   const artists = (
       window.BusiVibesData &&
       window.BusiVibesData.artists
   ) || [
       {
           slug: "paul-beats",
           name: "Paul Beats",
           genre: "Afropop Artist",
           image: "assets/images/paul-beats.png"
       },
       {
           slug: "decartella",
           name: "Decartella",
           genre: "Vocalist",
           image: "assets/images/artists2.jpg"
       },
       {
           slug: "kofi-jamar",
           name: "Kofi Jamar",
           genre: "Afrobeats Artist",
           image: "assets/images/artists3.jpg"
       },
       {
           slug: "lyrical-kings",
           name: "Lyrical Kings",
           genre: "Group",
           image: "assets/images/artists4.jpg"
       },
       {
           slug: "amaarae",
           name: "Amaarae",
           genre: "Afropop Artist",
           image: "assets/images/artists5.jpg"
       },
       {
           slug: "black-tunez",
           name: "Black Tunez",
           genre: "Producer",
           image: "assets/images/artists6.jpg"
       }
   ];

   // ========================================
   // ARTISTS CONTAINER
   // ========================================

   const artistsContainer =
       document.getElementById(
           "artistsContainer"
       );

   // ========================================
   // DISPLAY ARTISTS
   // ========================================

   function renderArtists(list) {

       if (!list.length) {

           artistsContainer.innerHTML = `

               <div class="empty-artists">

                   <h3>
                       No artists found
                   </h3>

                   <p>
                       Try searching for another artist.
                   </p>

               </div>

           `;

           return;

       }

       artistsContainer.innerHTML =
           list.map(function(artist) {

               return `

                   <div class="artist-directory-card">

                       <div class="artist-directory-image">

                           <img
                               src="${artist.image}"
                               alt="${artist.name}"
                           >

                       </div>

                       <h3>
                           ${artist.name}
                       </h3>

                       <p>
                           ${artist.genre}
                       </p>

                       <button
                           class="artist-view-btn"
                           data-artist="${artist.name}"
                       >
                           View Artist
                       </button>

                   </div>

               `;

           }).join("");

       // ========================================
       // VIEW ARTIST
       // ========================================

       document
           .querySelectorAll(".artist-view-btn")
           .forEach(function(button) {

               button.addEventListener(
                   "click",
                   function() {

                       const artistName =
                           button.dataset.artist;

                       const artistSlug =
                           artistName
                               .toLowerCase()
                               .replace(/\s+/g, "-");

                       window.location.href =
                           "pages/artist-profile.html?artist=" +
                           artistSlug;

                   }
               );

           });

   }

   // ========================================
   // INITIAL DISPLAY
   // ========================================

   renderArtists(artists);

   // ========================================
   // SEARCH ARTISTS
   // ========================================

   const artistSearch =
       document.getElementById(
           "artistSearch"
       );

   artistSearch.addEventListener(
       "input",
       function() {

           const searchTerm =
               artistSearch.value
                   .toLowerCase()
                   .trim();

           const filteredArtists =
               artists.filter(function(artist) {

                   return (

                       artist.name
                           .toLowerCase()
                           .includes(searchTerm)

                       ||

                       artist.genre
                           .toLowerCase()
                           .includes(searchTerm)

                   );

               });

           renderArtists(filteredArtists);

       }
   );

   // ========================================
   // LOGOUT
   // ========================================

   const logoutButton =
       document.querySelector(".logout");

   if (logoutButton) {

       logoutButton.addEventListener(
           "click",
           function(event) {

               event.preventDefault();

               localStorage.removeItem(
                   "busiVibesLoggedIn"
               );

               localStorage.removeItem(
                   "busiVibesCurrentUser"
               );

               window.location.href =
                   "login.html";

           }
       );

   }

</script>


</body>

</html>
